<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Defaults for crawlers and link previews, which read this file without
      running JavaScript. __SITE_URL__ is filled in at build time (seoFiles in
      vite.config.ts). The app then sets each page's title, description,
      canonical link and robots tag as it moves between routes (src/lib/seo.ts).
    -->
    <title>Water delivery in Enugu, poured into your tank | Waterline</title>
    <meta
      name="description"
      content="Order water in Enugu by keke or tanker. We pour it straight into your drums or tank. See the full price before you confirm and pay cash on delivery."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta name="theme-color" content="#FFFFFF" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Customer app manifest; pages under /partner/ switch it to /partner.webmanifest (src/features/pwa/manifest.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (WhatsApp, Facebook, X, LinkedIn). Absolute URLs: share crawlers need them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Waterline" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Water delivery in Enugu, poured into your tank | Waterline" />
    <meta
      property="og:description"
      content="Order water by keke or tanker. We pour it straight into your drums or tank, and you pay cash on delivery."
    />
    <meta property="og:image" content="__SITE_URL__/marketing/og-waterline.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Waterline: water at your gate. A keke delivering water to a compound in Enugu." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Water delivery in Enugu, poured into your tank | Waterline" />
    <meta name="twitter:description" content="Order water by keke or tanker. We pour it straight into your drums or tank, and you pay cash on delivery." />
    <meta name="twitter:image" content="__SITE_URL__/marketing/og-waterline.jpg" />

    <!-- Who we are and what we do, for search engines (schema.org). No prices, ratings or hours: only facts the app keeps. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Waterline",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/icons/icon-512.png",
            "email": "olivetgrail@gmail.com",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+234-813-377-4902",
              "contactType": "customer service",
              "areaServed": "NG",
              "availableLanguage": ["en"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "Waterline",
            "inLanguage": "en-NG",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          },
          {
            "@type": "Service",
            "@id": "__SITE_URL__/#water-delivery",
            "name": "Water delivery in Enugu",
            "serviceType": "Water delivery",
            "description": "Water delivered by keke in 25 or 50 litre cans poured into your drums, or by tanker pumped into your ground or overhead tank. Pay cash on delivery.",
            "provider": { "@id": "__SITE_URL__/#organization" },
            "areaServed": { "@type": "City", "name": "Enugu", "containedInPlace": { "@type": "State", "name": "Enugu State" } },
            "url": "__SITE_URL__/"
          }
        ]
      }
    </script>

    <!-- Fraunces (headings) and Inter (text). If they fail, src/styles/fonts.css serves Plus Jakarta Sans from our own origin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..800,0..100,0..1&family=Inter:wght@400..800&display=swap"
    />
  </head>
  <body>
    <noscript>
      <p>Waterline delivers water in Enugu by keke or tanker and pours it into your drums or tank. Turn on JavaScript to order, or call 0813 377 4902.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
