<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Waterline</title>
    <meta name="description" content="Order water in Enugu and have it poured into your tank." />
    <meta name="theme-color" content="#FFFFFF" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Customer app manifest; pages under /partner/ switch it to /partner.webmanifest (src/features/pwa/manifest.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews when the site is shared (read from this static file, not from JavaScript). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Waterline" />
    <meta property="og:title" content="Waterline | Water delivery in Enugu" />
    <meta property="og:description" content="Order water by keke or tanker in Enugu and have it poured into your drums or tank." />
    <meta property="og:image" content="/marketing/hero-scene.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fraunces (headings) and Inter (text). If they fail, src/styles/fonts.css serves Plus Jakarta Sans from our own origin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..800,0..100,0..1&family=Inter:wght@400..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
